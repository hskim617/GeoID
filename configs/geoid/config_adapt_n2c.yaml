##################
## Model options
model:
  name: 'MinkUNet34_geoid'
  in_feat_size: 1
  out_classes: 16

###################
## Dataset options
dataset_SemKITTI:
  data_path: "./data/SemanticKITTI/sequences"
  ignore_label: 0
  label_mapping: "./configs/label_mapping/semantic-kitti.yaml"
  max_volume_space:
    - 50.
    - 50.
    - 2.
  min_volume_space:
    - -50.
    - -50.
    - -4.
  voxel_size: 0.2
  beam: 64
  fov: [-23.6, 3.2]

  
dataset_nuScenes:
  data_path: "./data/nuScenes"
  ignore_label: 0
  label_mapping: "./configs/label_mapping/nuscenes.yaml"
  max_volume_space:
    - 50.
    - 50.
    - 3
  min_volume_space:
    - -50.
    - -50.
    - -5
  voxel_size: 0.2
  beam: 32
  fov: [-30.67, 10.67]

# Corruption datasets
dataset_SemKITTI_C:
  data_path: "./data/SemanticKITTI-C/SemanticKITTI-C"
  data_path_orig: "./data/SemanticKITTI/sequences"
  ignore_label: 0
  label_mapping: "./configs/label_mapping/semantic-kitti-c.yaml"
  max_volume_space:
    - 50.
    - 50.
    - 2.
  min_volume_space:
    - -50.
    - -50.
    - -4.
  voxel_size: 0.2
  beam: 64
  fov: [-23.6, 3.2]

dataset_nuScenes_C:
  data_path: "./data/nuScenes-C/nuScenes-C"
  data_path_orig: "./data/nuScenes"
  ignore_label: 0
  label_mapping: "./configs/label_mapping/nuscenes-c.yaml"
  max_volume_space:
    - 50.
    - 50.
    - 3
  min_volume_space:
    - -50.
    - -50.
    - -5
  voxel_size: 0.2
  beam: 32
  fov: [-30.67, 10.67]

###################
## Dataloader options
train_dataloader:
  training: True
  batch_size: 4
  shuffle: True
  num_workers: 8
  pin_memory: True
  drop_last: True

val_dataloader:
  training: False
  batch_size: 1
  shuffle: False
  num_workers: 8
  pin_memory: False

test_dataloader:
  training: False
  batch_size: 1
  shuffle: False
  num_workers: 8
  pin_memory: False

###################
## Train params
train_params:
  max_steps: 200000
  learning_rate: 0.01
  criterion: "cross_entropy"
  use_pretrained: False
  pretrained_ckpt_path: null
  resume_ckpt: null
  
generalization_params:
  source: 'nuscenes'
  target: ['nuscenes']
  use_ref: True
  use_instance: False

###################
## GeoID params
geoid_params:
  use_geoid: True
  geoid_type: 'frame'
  geoid_configure_type: 'axis'
  geoid_p: 0.0
  min_dist: 1
  max_dist: 3

## TTA GeoID params
tta_geoid_params:
  geoid_type: 'point'
  geoid_configure_type: 'axis'
  geoid_p: 0.0
  min_dist: 1
  max_dist: 3

#####################
## Test-time training params
test_time_adaptation_params:
  target: 'nuscenes_c'
  
  corr_type_list:  ['crosstalk', 'beam_missing', 'cross_sensor', 'fog', 'incomplete_echo', 'motion_blur', 'snow', 'wet_ground']
  corr_level_list: ['light', 'moderate', 'heavy']
  
  test_only: False
  test_time_adaptation: True
  online: True
  disable_bn_adaptation: True
  batch_size_tta: 1
  inner_batch_size_tta: 2
  ###################
  learning_rate_tta: 0.001
  weight_decay_tta: 0.
  grad_steps: 1
  ####################
  # loss
  apply_noise_mask: True
  noise_threshold: 0.5
  threshold_margin_orig: 0.3
  threshold_margin_noise: 0.3
  bidirection_mask: True
  
  log_freq: 10  
  visualize: False

  model_ckpt_path: "checkpoints/nusc_source_train.ckpt"
#####################
## Experiment params
exp_params:
  exp_name: "ExpTTA_GeoID"
  log_dir: "nusc_corr_adapt"
  log_freq: 500